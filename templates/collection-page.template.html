<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@poki2online" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="{{OG_IMAGE}}" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <main class="container">
    <section class="hero card">
      <h1>{{H1}}</h1>
      <p>{{INTRO}}</p>
      <div id="game-shell" class="game-shell">
        <div class="embed-placeholder">
          <div>
            <p>{{HERO_PROMPT}}</p>
            <button class="play-now" data-embed-src="{{EMBED_URL}}">Play Now</button>
          </div>
        </div>
      </div>
      <small class="kbd">Tip: press F11 for full screen play.</small>
    </section>

    <section class="card">
      <h2>Best 2048 Variants</h2>
      <div class="grid">
        {{VARIANT_TILES}}
      </div>
    </section>

    <section class="card">
      <h2>{{CONTENT_H2}}</h2>
      <p>{{CONTENT_P1}}</p>
      <h3>{{CONTENT_H3_A}}</h3>
      <p>{{CONTENT_P2}}</p>
      <h3>{{CONTENT_H3_B}}</h3>
      <p>{{CONTENT_P3}}</p>
    </section>
  </main>

  <footer class="container">
    <p>Powered by curated browser game embeds. This page is a game collection hub.</p>
  </footer>

  <script src="/assets/js/site.js" defer></script>
</body>
</html>
